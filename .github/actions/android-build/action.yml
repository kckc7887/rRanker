name: Build Android artifacts
description: Build ABI-specific Release APKs, verify them, run device smoke checks, and upload.
inputs:
  source-sha:
    description: Source commit
    required: true
  production:
    description: Use production signing
    required: false
    default: "false"
  signing-mode:
    description: release, legacy-debug, or test-debug
    required: false
    default: test-debug
  expected-certificate-sha256:
    description: Existing signing certificate
    required: false
    default: ""
  optimization-mode:
    description: Android optimization mode
    required: false
    default: A
runs:
  using: composite
  steps:
    - name: Verify source and signing configuration
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        PRODUCTION_BUILD: ${{ inputs.production }}
        SIGNING_MODE: ${{ inputs.signing-mode }}
      run: |
        test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
        if [ "$PRODUCTION_BUILD" = true ]; then
          test "$PRODUCTION_SIGNING_READY" = true
          if [ "$SIGNING_MODE" = release ]; then
            test -n "${ANDROID_KEYSTORE_BASE64:-}"
            test -n "${ANDROID_KEYSTORE_PASSWORD:-}"
            test -n "${ANDROID_KEY_ALIAS:-}"
            test -n "${ANDROID_KEY_PASSWORD:-}"
          fi
        fi
    - uses: ./.github/actions/android-setup
    - name: Expo prebuild
      env:
        NODE_ENV: production
        BUILD_SOURCE_COMMIT: ${{ inputs.source-sha }}
        ANDROID_OPTIMIZATION_MODE: ${{ inputs.optimization-mode }}
      run: npm run prebuild:android
      shell: bash
      working-directory: apps/mobile
    - name: Prepare release keystore
      if: inputs.signing-mode == 'release'
      run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/rranker-release.keystore
      shell: bash
      working-directory: apps/mobile
    - name: Build four ABI APKs
      working-directory: apps/mobile/android
      env:
        NODE_ENV: production
        SIGNING_MODE: ${{ inputs.signing-mode }}
      run: |
        chmod +x gradlew
        SIGNING_ARGS=()
        if [ "$SIGNING_MODE" = release ]; then
          SIGNING_ARGS=(
            "-Pandroid.injected.signing.store.file=$PWD/app/rranker-release.keystore"
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
          )
        fi
        ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2 \
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 \
          "${SIGNING_ARGS[@]}"
      shell: bash
    - name: Verify and name APKs
      id: apks
      env:
        SIGNING_MODE: ${{ inputs.signing-mode }}
        EXPECTED_CERTIFICATE_SHA256: ${{ inputs.expected-certificate-sha256 }}
        BUILD_SOURCE_COMMIT: ${{ inputs.source-sha }}
        ANDROID_OPTIMIZATION_MODE: ${{ inputs.optimization-mode }}
      run: python3 ../../.github/scripts/verify-android-apks.py
      shell: bash
      working-directory: apps/mobile
    - name: Enable KVM
      shell: bash
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Release smoke through production routes
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 31
        arch: x86_64
        target: default
        disable-animations: true
        script: node .github/scripts/android-smoke.mjs production apps/mobile/build/android-apks/*-x86_64.apk emulator-5554 apps/mobile/build/device-evidence
    - name: Upload device verification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-device-evidence-${{ inputs.source-sha }}-${{ github.run_attempt }}
        path: apps/mobile/build/device-evidence/
        if-no-files-found: warn
        retention-days: 7
    - name: Upload verified APKs
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.apks.outputs.artifact_name }}-${{ inputs.production == 'true' && 'release' || 'test' }}-${{ inputs.source-sha }}-${{ github.run_attempt }}
        path: apps/mobile/build/android-apks/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
    - name: Remove temporary release keystore
      if: always()
      shell: bash
      run: rm -f apps/mobile/android/app/rranker-release.keystore
