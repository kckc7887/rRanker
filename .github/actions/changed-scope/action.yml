name: Changed scope
description: 文档与展示资源跳过构建，其他改动执行完整检查
inputs:
  base-sha:
    description: 比较基准提交，留空时按事件推导
    required: false
    default: ""
  head-sha:
    description: 比较目标提交，留空时使用 HEAD
    required: false
    default: ""
outputs:
  functional:
    description: 需要完整检查，无法判定时为 true
    value: ${{ steps.classify.outputs.functional }}
  reason:
    description: 判定原因
    value: ${{ steps.classify.outputs.reason }}
  changed-count:
    description: 变更文件数
    value: ${{ steps.classify.outputs.changed-count }}
runs:
  using: composite
  steps:
    - name: Classify changed paths
      id: classify
      shell: bash
      env:
        SCOPE_EVENT_NAME: ${{ github.event_name }}
        SCOPE_PUSH_BEFORE: ${{ github.event.before }}
        SCOPE_PR_BASE: ${{ github.event.pull_request.base.sha }}
        SCOPE_INPUT_BASE: ${{ inputs.base-sha }}
        SCOPE_INPUT_HEAD: ${{ inputs.head-sha }}
      run: bash "${{ github.action_path }}/classify.sh"
