name: Changed scope

description: 仅文档与展示资源走快速路径，CI、依赖与构建配置必须完整检查

inputs:
  base-sha:
    description: 比较基准提交，留空时按当前事件推导
    required: false
    default: ""
  head-sha:
    description: 比较目标提交，留空时使用已检出的 HEAD
    required: false
    default: ""

outputs:
  functional:
    description: 需要完整检查为 true；无法判定时同样为 true
    value: ${{ steps.classify.outputs.functional }}
  reason:
    description: 判定依据，固定枚举 no-base / base-unavailable / diff-failed / no-changes / docs-only / functional
    value: ${{ steps.classify.outputs.reason }}
  changed-count:
    description: 本次比较的变更文件数量
    value: ${{ steps.classify.outputs.changed-count }}

runs:
  using: composite

  steps:
    # 判定逻辑在 classify.sh 里，可单独运行（bash -n / self-test.mjs），不依赖 npm 依赖
    - name: Classify changed paths
      id: classify
      shell: bash
      env:
        SCOPE_EVENT_NAME: ${{ github.event_name }}
        SCOPE_PUSH_BEFORE: ${{ github.event.before }}
        SCOPE_PR_BASE: ${{ github.event.pull_request.base.sha }}
        SCOPE_INPUT_BASE: ${{ inputs.base-sha }}
        SCOPE_INPUT_HEAD: ${{ inputs.head-sha }}
      run: bash "${{ github.action_path }}/classify.sh"
