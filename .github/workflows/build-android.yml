name: Build Android APKs
on:
  workflow_run:
    workflows:
      - Quality
    types:
      - completed
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: rranker-android-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false
jobs:
  build-context:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      build: ${{ steps.policy.outputs.build }}
      production: ${{ steps.policy.outputs.production }}
      sha: ${{ steps.policy.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Determine immutable source and publication policy
        id: policy
        run: node .github/scripts/build-policy.mjs
      - uses: actions/setup-node@v6
        if: github.event_name == 'workflow_dispatch' && steps.policy.outputs.build == 'true'
        with:
          node-version: "22"
      - name: Validate manual build source
        if: github.event_name == 'workflow_dispatch' && steps.policy.outputs.build == 'true'
        working-directory: apps/mobile
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run check:architecture
          npm run check:generated
          npm run audit:prod
  changed-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      functional: ${{ steps.read.outputs.functional }}
    steps:
      - name: Download scope verdict
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: changed-scope
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/changed-scope
      - name: Read scope verdict
        id: read
        shell: bash
        env:
          VERDICT: ${{ runner.temp }}/changed-scope/verdict.env
        run: |
          functional=true
          if [ -f "$VERDICT" ]; then
            recorded="$(sed -n 's/^functional=//p' "$VERDICT" | tail -n 1)"
            reason="$(sed -n 's/^reason=//p' "$VERDICT" | tail -n 1)"
            if [ "$recorded" = "false" ]; then
              functional=false
            fi
            echo "轻检查判定：functional=${recorded:-未知}，reason=${reason:-未知}"
          else
            echo "取不到轻检查判定，按有功能改动处理"
          fi
          echo "functional=$functional" >> "$GITHUB_OUTPUT"
  build-android:
    needs:
      - changed-scope
      - build-context
    if: always() && needs.build-context.result == 'success' && needs.build-context.outputs.build == 'true' && (github.event_name == 'workflow_dispatch' || needs.changed-scope.outputs.functional != 'false')
    environment: ${{ needs.build-context.outputs.production == 'true' && 'production-release' || 'test-artifacts' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_ENV: production
      BUILD_SOURCE_COMMIT: ${{ needs.build-context.outputs.sha }}
      ANDROID_OPTIMIZATION_MODE: A
      OSU_OAUTH_CLIENT_SECRET: ${{ needs.build-context.outputs.production == 'true' && secrets.OSU_OAUTH_CLIENT_SECRET || '' }}
      ANDROID_KEYSTORE_BASE64: ${{ needs.build-context.outputs.production == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ needs.build-context.outputs.production == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ needs.build-context.outputs.production == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ needs.build-context.outputs.production == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
      PRODUCTION_SIGNING_READY: ${{ needs.build-context.outputs.production == 'true' && secrets.PRODUCTION_SIGNING_READY || '' }}
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build-context.outputs.sha }}
      - name: Build and verify APKs
        id: apks
        uses: ./.github/actions/android-build
        with:
          source-sha: ${{ needs.build-context.outputs.sha }}
          production: ${{ needs.build-context.outputs.production }}
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apks.outputs.artifact-name }}
          path: apps/mobile/build/android-apks/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
