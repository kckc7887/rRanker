name: Validate optimization

on:
  push:
    branches: [origin/optimize-architecture-performance]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      OPTIMIZATION_BASELINE_SHA: 246f0bbe57bb9a23ce21858c82c53b3066aad3d9
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install candidate dependencies
        run: npm ci
      - name: Validate code, types and architecture
        run: |
          mkdir -p build
          npm run lint 2>&1 | tee build/optimization-lint.log
          npm run typecheck 2>&1 | tee build/optimization-types.log
          npm run check:architecture 2>&1 | tee build/optimization-architecture.log
          npm run check:generated 2>&1 | tee build/optimization-generated.log
          npm run check:lossless-assets 2>&1 | tee build/optimization-lossless-assets.log
      - name: Unit tests
        run: npm run test:unit -- --reporter=default --reporter=json --outputFile=build/optimization-unit-results.json 2>&1 | tee build/optimization-unit.log
      - name: UI and unchanged visual contracts
        run: |
          npm run test:ui -- --json --outputFile=build/optimization-ui-results.json 2>&1 | tee build/optimization-ui.log
          node --input-type=module -e 'import fs from "node:fs"; const log=fs.readFileSync("build/optimization-ui.log","utf8"); if (/overlapping act|not wrapped in act|without await|not configured to support act/.test(log)) throw new Error("Unsettled UI test work; inspect optimization-ui.log");'
      - name: Compare renderer commands and measure CPU work
        run: npm run benchmark:optimization 2>&1 | tee build/optimization-performance.log
      - name: Export candidate Android and iOS
        run: npx --no-install expo export --platform android --platform ios --source-maps --dump-assetmap --max-workers 4 --output-dir build/optimization-candidate 2>&1 | tee build/optimization-export-candidate.log
      - name: Checkout fixed baseline into ignored build directory
        uses: actions/checkout@v6
        with:
          ref: ${{ env.OPTIMIZATION_BASELINE_SHA }}
          path: apps/mobile/build/optimization-baseline-source
          persist-credentials: false
      - name: Install and export baseline on the same runner
        working-directory: apps/mobile/build/optimization-baseline-source/apps/mobile
        env:
          EXPORT_DIRECTORY: ${{ github.workspace }}/apps/mobile/build/optimization-baseline
          EXPORT_LOG: ${{ github.workspace }}/apps/mobile/build/optimization-export-baseline.log
        run: |
          npm ci
          test "$(git rev-parse HEAD)" = "$OPTIMIZATION_BASELINE_SHA"
          npx --no-install expo export --platform android --platform ios --source-maps --dump-assetmap --max-workers 4 --output-dir "$EXPORT_DIRECTORY" 2>&1 | tee "$EXPORT_LOG"
      - name: Compare exact revisions
        run: |
          node scripts/compare-optimization-exports.mjs build/optimization-baseline build/optimization-candidate "$OPTIMIZATION_BASELINE_SHA" "$(git rev-parse HEAD)"
          cat build/optimization-size.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: optimization-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          path: |
            apps/mobile/build/optimization-*.json
            apps/mobile/build/optimization-*.log
            apps/mobile/build/optimization-size.md
            apps/mobile/build/optimization-baseline/metadata.json
            apps/mobile/build/optimization-baseline/assetmap.json
            apps/mobile/build/optimization-candidate/metadata.json
            apps/mobile/build/optimization-candidate/assetmap.json
