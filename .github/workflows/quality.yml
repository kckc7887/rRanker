name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rranker-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changed-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      functional: ${{ steps.classify.outputs.functional }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/changed-scope

      - name: Write scope verdict
        env:
          FUNCTIONAL: ${{ steps.classify.outputs.functional }}
          REASON: ${{ steps.classify.outputs.reason }}
          CHANGED_COUNT: ${{ steps.classify.outputs.changed-count }}
        run: |
          mkdir -p changed-scope
          {
            echo "functional=$FUNCTIONAL"
            echo "reason=$REASON"
            echo "changed-count=$CHANGED_COUNT"
          } > changed-scope/verdict.env

      - name: Upload scope verdict
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: changed-scope
          path: changed-scope/verdict.env
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  # 独立于功能判定的轻检查：不依赖 changed-scope 的结论，也不跑构建，只装 .github/scripts 里
  # 固定的 YAML 解析器（零传递依赖），不安装 apps/mobile 的依赖树，
  # 因此改动被归类为 CI-only 或纯文档时质量作业会被跳过，这一步仍然会跑。
  light-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # 只装轻检查自己那一个包，不安装 apps/mobile 依赖树
      - name: Install light check dependencies
        working-directory: .github/scripts
        run: npm ci

      - name: Repository light check
        run: node .github/scripts/check-light.mjs --self-test

  quality:
    needs: changed-scope
    if: always() && needs.changed-scope.outputs.functional != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Architecture
        run: npm run check:architecture

      - name: Generated players
        run: npm run check:generated

      - name: Production audit
        run: npm run audit:prod
