name: Quality
on:
  push:
    branches:
      - "**"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changed-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      functional: ${{ steps.classify.outputs.functional }}
      build: ${{ steps.policy.outputs.build }}
      production: ${{ steps.policy.outputs.production }}
      sha: ${{ steps.policy.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Determine build policy
        id: policy
        run: node .github/scripts/build-policy.mjs
      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/changed-scope
        with:
          head-sha: ${{ steps.policy.outputs.sha }}
  quality:
    needs: changed-scope
    if: needs.changed-scope.outputs.functional == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changed-scope.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and UI tests
        run: npm test
      - name: Generated player consistency
        run: npm run check:generated
      - name: CI script behavior tests
        working-directory: .
        run: |
          node --test .github/scripts/*.test.mjs
          python3 -B .github/scripts/verify-ios-archive.test.py
          python3 -B .github/scripts/android_signing.test.py
  android-release:
    needs: [changed-scope, quality]
    if: needs.quality.result == 'success' && needs.changed-scope.outputs.build == 'true' && needs.changed-scope.outputs.production == 'true' && github.repository == 'kckc7887/rRanker' && startsWith(github.ref, 'refs/heads/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.deleted
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 120
    env:
      NODE_ENV: production
      BUILD_SOURCE_COMMIT: ${{ needs.changed-scope.outputs.sha }}
      OSU_OAUTH_CLIENT_SECRET: ${{ secrets.OSU_OAUTH_CLIENT_SECRET }}
      PRODUCTION_SIGNING_READY: ${{ secrets.PRODUCTION_SIGNING_READY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changed-scope.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/android-build
        with:
          source-sha: ${{ needs.changed-scope.outputs.sha }}
          production: "true"
          signing-mode: legacy-debug
          expected-certificate-sha256: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
  ios-release:
    needs: [changed-scope, quality]
    if: needs.quality.result == 'success' && needs.changed-scope.outputs.build == 'true' && needs.changed-scope.outputs.production == 'true' && github.repository == 'kckc7887/rRanker' && startsWith(github.ref, 'refs/heads/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.event.deleted
    runs-on: macos-26
    environment: production-release
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    concurrency:
      group: rranker-ios-testflight
      cancel-in-progress: false
      queue: max
    env:
      NODE_ENV: production
      BUILD_SOURCE_COMMIT: ${{ needs.changed-scope.outputs.sha }}
      OSU_OAUTH_CLIENT_SECRET: ${{ secrets.OSU_OAUTH_CLIENT_SECRET }}
      PRODUCTION_SIGNING_READY: ${{ secrets.PRODUCTION_SIGNING_READY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changed-scope.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ios-build
        with:
          source-sha: ${{ needs.changed-scope.outputs.sha }}
          production: "true"
  android-fork-test:
    needs: [changed-scope, quality]
    if: needs.quality.result == 'success' && needs.changed-scope.outputs.build == 'true' && needs.changed-scope.outputs.production == 'false' && github.repository == 'kckc7887/rRanker' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NODE_ENV: production
      BUILD_SOURCE_COMMIT: ${{ needs.changed-scope.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changed-scope.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/android-build
        with:
          source-sha: ${{ needs.changed-scope.outputs.sha }}
          production: "false"
  ios-fork-test:
    needs: [changed-scope, quality]
    if: needs.quality.result == 'success' && needs.changed-scope.outputs.build == 'true' && needs.changed-scope.outputs.production == 'false' && github.repository == 'kckc7887/rRanker' && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 120
    env:
      NODE_ENV: production
      BUILD_SOURCE_COMMIT: ${{ needs.changed-scope.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.changed-scope.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/ios-build
        with:
          source-sha: ${{ needs.changed-scope.outputs.sha }}
          production: "false"
  quality-gate:
    needs: [changed-scope, quality, android-release, ios-release, android-fork-test, ios-fork-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require expected job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const scope = needs['changed-scope'];
          if (scope.result !== 'success') throw new Error('Changed scope failed or was cancelled');
          const { functional, build, production } = scope.outputs;
          if (![functional, build, production].every(value => value === 'true' || value === 'false')) {
            throw new Error('Changed scope outputs are missing');
          }
          const expected = {
            quality: functional === 'true',
            'android-release': functional === 'true' && build === 'true' && production === 'true',
            'ios-release': functional === 'true' && build === 'true' && production === 'true',
            'android-fork-test': functional === 'true' && build === 'true' && production === 'false',
            'ios-fork-test': functional === 'true' && build === 'true' && production === 'false',
          };
          for (const [job, required] of Object.entries(expected)) {
            const result = needs[job].result;
            if (result !== (required ? 'success' : 'skipped')) throw new Error(`${job}: ${result}`);
          }
          NODE
