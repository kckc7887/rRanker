[package]
name = "rranker-desktop"
version = "0.1.0"
description = "rRanker desktop application"
authors = ["rRanker contributors"]
edition = "2021"

[lib]
name = "rranker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
