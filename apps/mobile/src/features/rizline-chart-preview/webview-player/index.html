<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>谱面确认</title>
  <style>
    /*PREVIEW_STYLE*/
    /*PREVIEW_STAGE_STYLE*/
    #stage-wrap {
      flex: 1;
      min-height: 0;
    }

    .stage {
      height: 100%;
    }

    #playfield { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    body.fullscreen .stage {
      width: 100%;
      height: 100%;
    }
  </style>
  <style>/*PREVIEW_CONTROLS_STYLE*/</style>
</head>
<body class="preview-controls">
  <div id="app">
    <header id="header">
      <span id="title">谱面确认</span>
      <span id="status"></span>
    </header>
    <div id="stage-wrap">
      <section class="stage" id="stage" aria-label="谱面确认舞台">
        <canvas id="playfield" aria-hidden="true"></canvas>
      </section>
    </div>
    <template id="preview-settings">
      <section class="preview-section">
        <h3>播放设置</h3>
        <div class="row wrap controls-settings">
        <div class="field wheel-field"><span>流速</span>
          <button data-presentation="inline" class="wheel-trigger" id="user-speed-trigger" type="button"><span id="user-speed-val">3.5</span></button>
          <!--PREVIEW_WHEEL user-speed|aria-label="流速拨轮"|-->
        </div>
        <div class="field wheel-field"><span>播放速度</span>
          <button data-presentation="inline" class="wheel-trigger" id="speed-trigger" type="button"><span id="speed-val">1.00×</span></button>
          <!--PREVIEW_WHEEL speed|aria-label="播放速度拨轮"|-->
        </div>
        <div class="field wheel-field"><span>音乐音量</span>
          <button data-presentation="inline" class="wheel-trigger" id="volume-trigger" type="button"><span id="volume-val">80%</span></button>
          <!--PREVIEW_WHEEL volume|aria-label="音乐音量拨轮"|-->
        </div>
        <div class="field wheel-field"><span>打击音量</span>
          <button data-presentation="inline" class="wheel-trigger" id="hit-sound-volume-trigger" type="button"><span id="hit-sound-volume-val">45%</span></button>
          <!--PREVIEW_WHEEL hit-sound-volume|aria-label="打击音量拨轮"|-->
        </div>
      </div>
      </section>
      <section class="preview-section">
        <h3>辅助选项</h3>
        <div class="row wrap controls-settings">
        <button class="toggle" id="hit-sound" type="button" aria-pressed="true">打击音</button>
      </div>
      </section>
    </template>
  </div>
  <!--PREVIEW_LOCK-->
  <script src="./chart-data.js"></script>
  <script src="./music-data.js"></script>
  <!--RIZLINE_CHART_PREVIEW_CONFIG-->
  <script>(function(){var c=window.__RIZLINE_CHART_PREVIEW_CONFIG__;if(c&&c.theme==='light'){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <!--PLAYER_SCRIPT-->
</body>
</html>
