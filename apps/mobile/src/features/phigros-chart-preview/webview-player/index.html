<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>谱面确认</title>
  <style>
    /*PREVIEW_STYLE*/
    /*PREVIEW_STAGE_STYLE*/
    #stage-wrap {
      flex-shrink: 0;
    }

    .stage {
      aspect-ratio: 16 / 9;
    }

    #chart-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .gl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; }

    .game-hud { position: absolute; z-index: 3; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.72); }

    .game-progress { position: absolute; top: 0; left: 0; width: 100%; height: var(--progress-height, 3px); background: rgba(255,255,255,.1); }

    .game-progress i { display: block; width: 0; height: 100%; background: rgba(255,255,255,.72); box-shadow: 0 0 5px #fff; }

    .score-block { position: absolute; top: 10px; right: 12px; display: grid; justify-items: end; line-height: 1; transform-origin: center; }

    .score-block strong { font-size: var(--score-font-size, 22px); font-weight: 600; letter-spacing: .02em; font-variant-numeric: tabular-nums; }

    .combo-block { position: absolute; top: 14px; left: 50%; translate: -50% 0; display: none; justify-items: center; line-height: .9; transform-origin: center; }

    .combo-block.is-visible { display: grid; }

    .combo-block strong { font-size: var(--combo-font-size, 26px); font-weight: 600; font-variant-numeric: tabular-nums; transform-origin: center; }

    .combo-block span { margin-top: .55em; font-size: var(--combo-label-font-size, 8px); letter-spacing: .08em; opacity: .85; }

    .hud-attach { position: absolute; left: 50%; top: 50%; transform-origin: center; font-family: inherit; font-size: clamp(16px, 2.6vw, 40px); font-weight: 700; color: #fff; white-space: nowrap; }

    #hud-pause { font-size: clamp(22px, 4vw, 64px); }

    #hud-name { font-size: clamp(14px, 2vw, 32px); }

    #hud-level { font-size: clamp(12px, 1.6vw, 24px); font-weight: 500; }

    body.fullscreen .stage {
      aspect-ratio: 16 / 9;
    }
  </style>
  <style>/*PREVIEW_CONTROLS_STYLE*/</style>
</head>
<body class="preview-controls">
  <div id="app">
    <header id="header">
      <span id="title">谱面确认</span>
      <span id="status"></span>
    </header>
    <div id="stage-wrap">
      <section class="stage" id="stage" aria-label="谱面确认舞台">
        <canvas id="chart-canvas" aria-hidden="true"></canvas>
        <div class="game-hud" aria-hidden="true">
          <div class="game-progress"><i id="game-progress-fill"></i></div>
          <div class="score-block"><strong id="score-display">0000000</strong></div>
          <div class="combo-block" id="combo-block"><strong id="combo-display">0</strong><span>COMBO</span></div>
          <div class="hud-attach" id="hud-pause" hidden>Ⅱ</div>
          <div class="hud-attach" id="hud-name" hidden></div>
          <div class="hud-attach" id="hud-level" hidden></div>
        </div>
      </section>
    </div>
    <template id="preview-settings">
      <section class="preview-section">
        <h3>播放设置</h3>
        <div class="row wrap controls-settings">
        <div class="field wheel-field"><span>播放速度</span>
          <button data-presentation="inline" class="wheel-trigger" id="speed-trigger" type="button"><span id="speed-val">1.00×</span></button>
          <!--PREVIEW_WHEEL speed|aria-label="播放速度拨轮"|-->
        </div>
        <div class="field wheel-field"><span>音符大小</span>
          <button data-presentation="inline" class="wheel-trigger" id="note-size-trigger" type="button"><span id="note-size-val">1.00×</span></button>
          <!--PREVIEW_WHEEL note-size|aria-label="音符大小拨轮"|-->
        </div>
        <div class="field wheel-field"><span>音乐音量</span>
          <button data-presentation="inline" class="wheel-trigger" id="volume-trigger" type="button"><span id="volume-val">100%</span></button>
          <!--PREVIEW_WHEEL volume|aria-label="音乐音量拨轮"|-->
        </div>
        <div class="field wheel-field"><span>背景暗度</span>
          <button data-presentation="inline" class="wheel-trigger" id="dim-trigger" type="button"><span id="dim-val">55%</span></button>
          <!--PREVIEW_WHEEL dim|aria-label="背景暗度拨轮"|-->
        </div>
        <div class="field wheel-field"><span>打击音量</span>
          <button data-presentation="inline" class="wheel-trigger" id="hit-sound-volume-trigger" type="button"><span id="hit-sound-volume-val">100%</span></button>
          <!--PREVIEW_WHEEL hit-sound-volume|aria-label="打击音量拨轮"|-->
        </div>
        <div class="field wheel-field"><span>判定线颜色</span>
          <button data-presentation="inline" class="wheel-trigger text" id="line-color-trigger" type="button"><span id="line-color-val">白色</span></button>
          <!--PREVIEW_WHEEL line-color|aria-label="判定线颜色拨轮"|-->
        </div>
      </div>
      </section>
      <section class="preview-section">
        <h3>辅助选项</h3>
        <div class="row wrap controls-settings">
        <button class="toggle" id="multi-hint" type="button" aria-pressed="true">多押辅助</button>
        <button class="toggle" id="show-block-area" type="button" aria-pressed="true">显示噪域</button>
        <button class="toggle" id="show-block-area-bounds" type="button" aria-pressed="false">显示噪域判定范围</button>
      </div>
      </section>
    </template>
  </div>
  <!--PREVIEW_LOCK-->
  <script src="./music-data.js"></script>
  <!--PHIGROS_CHART_PREVIEW_CONFIG-->
  <script>(function(){var c=window.__PHIGROS_CHART_PREVIEW__;if(c&&c.theme==='light'){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <!--PLAYER_SCRIPT-->
</body>
</html>
