<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>谱面确认</title>
  <style>
    /*PREVIEW_STYLE*/
    /*PREVIEW_STAGE_STYLE*/
    #app {
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    #stage-wrap {
      flex-shrink: 0;
    }

    .stage {
      aspect-ratio: 16 / 9;
    }

    #playfield { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    body.fullscreen .stage {
      aspect-ratio: 16 / 9;
    }

    [hidden] { display: none !important; }

    .notice { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; flex-shrink: 0; }

    .notice:empty, body.fullscreen .notice { display: none; }

    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    body.fullscreen #app { overflow: hidden; }
  </style>
  <style>/*PREVIEW_CONTROLS_STYLE*/</style>
</head>
<body class="preview-controls">
  <div id="app">
    <header id="header"><span id="title">谱面确认</span><span id="status" role="status">正在准备播放</span></header>
    <p id="mode-notice" class="notice" role="status"></p>
    <div id="stage-wrap">
      <section class="stage" id="stage" aria-label="谱面确认舞台"><canvas id="playfield" width="1280" height="720" aria-hidden="true"></canvas></section>
    </div>
    <p id="media-notice" class="notice" role="status"></p>
    <template id="preview-settings" data-seek-slider>
      <section class="preview-section">
        <h3>画面设置</h3>
        <div class="row wrap controls-settings">
        <div class="field wheel-field"><span>音乐速度</span>
          <button data-presentation="inline" class="wheel-trigger" id="speed-trigger" type="button" disabled><span id="speed-val">1.00×</span></button>
          <!--PREVIEW_WHEEL speed||tabindex="0"-->
        </div>
        <div class="field wheel-field"><span>背景亮度</span>
          <button data-presentation="inline" class="wheel-trigger" id="brightness-trigger" type="button" aria-label="背景亮度" disabled><span id="brightness-val">20%</span></button>
          <!--PREVIEW_WHEEL brightness|aria-label="背景亮度拨轮"|role="listbox" tabindex="0" aria-label="背景亮度"-->
        </div>
        <div class="field wheel-field"><span>背景模糊</span>
          <button data-presentation="inline" class="wheel-trigger" id="blur-trigger" type="button" aria-label="背景模糊" disabled><span id="blur-val">0 px</span></button>
          <!--PREVIEW_WHEEL blur|aria-label="背景模糊拨轮"|role="listbox" tabindex="0" aria-label="背景模糊"-->
        </div>
        <div class="field wheel-field" data-mode="3" hidden><span>mania 样式</span>
          <button data-presentation="inline" class="wheel-trigger" id="mania-skin-trigger" type="button" aria-label="mania 样式" disabled><span id="mania-skin-val">砖块</span></button>
          <!--PREVIEW_WHEEL mania-skin|aria-label="mania 样式拨轮"|role="listbox" tabindex="0" aria-label="mania 样式"-->
        </div>
        <div class="field wheel-field" data-mode="3" hidden><span>流速</span>
          <button data-presentation="inline" class="wheel-trigger" id="scroll-speed-trigger" type="button" aria-label="流速" disabled><span id="scroll-speed-val">8.0</span></button>
          <!--PREVIEW_WHEEL scroll-speed|aria-label="流速拨轮"|role="listbox" tabindex="0" aria-label="流速"-->
        </div>
        <div class="field wheel-field" data-mode="3" hidden><span>Hold 宽度</span>
          <button data-presentation="inline" class="wheel-trigger" id="hold-width-trigger" type="button" aria-label="Hold 宽度" disabled><span id="hold-width-val">60%</span></button>
          <!--PREVIEW_WHEEL hold-width|aria-label="Hold 宽度拨轮"|role="listbox" tabindex="0" aria-label="Hold 宽度"-->
        </div>
        <div class="field wheel-field" data-mode="3" hidden><span>轨道不透明度</span>
          <button data-presentation="inline" class="wheel-trigger" id="mania-track-opacity-trigger" type="button" aria-label="轨道不透明度" disabled><span id="mania-track-opacity-val">100%</span></button>
          <!--PREVIEW_WHEEL mania-track-opacity|aria-label="轨道不透明度拨轮"|role="listbox" tabindex="0" aria-label="轨道不透明度"-->
        </div>
        <div class="field wheel-field" data-mode="1" hidden><span>轨道不透明度</span>
          <button data-presentation="inline" class="wheel-trigger" id="taiko-track-opacity-trigger" type="button" aria-label="轨道不透明度" disabled><span id="taiko-track-opacity-val">100%</span></button>
          <!--PREVIEW_WHEEL taiko-track-opacity|aria-label="轨道不透明度拨轮"|role="listbox" tabindex="0" aria-label="轨道不透明度"-->
        </div>
      </div>
      </section>
      <section class="preview-section">
        <h3>辅助选项</h3>
        <div class="row wrap controls-settings">
        <button class="toggle" id="storyboard-enabled" type="button" aria-pressed="true" hidden disabled>故事板</button>
        <button class="toggle" id="video-enabled" type="button" aria-pressed="true" hidden disabled>背景视频</button>
        <button class="toggle" id="mania-ignore-sv" type="button" data-mode="3" aria-pressed="false" hidden disabled>无视 SV</button>
      </div>
      </section>
    </template>
  </div>
  <!--PREVIEW_LOCK-->
  <!--OSU_CHART_PREVIEW_CONFIG-->
  <script>(function(){var c=window.__OSU_CHART_PREVIEW_CONFIG__;if(c&&c.theme==='light'){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <!--PLAYER_SCRIPT-->
</body>
</html>
