<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>谱面确认</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #161a22;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #5b8cff;
      --border: #2a3140;
      --wheel-item-h: 28px;
      --playhead: #fff;
      --playhead-glow: 0 0 8px rgba(255,255,255,0.7);
      --badge-bg: #fff;
      --badge-text: #0b0d12;
      --wheel-bg: #0f131a;
      --overlay-panel: rgba(11,13,18,0.92);
      --lock-bg: rgba(11,13,18,0.6);
      --lock-bg-strong: rgba(11,13,18,0.8);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #F7F8FA;
      --panel: #FFFFFF;
      --text: #111827;
      --muted: #6B7280;
      --border: #D1D5DB;
      --playhead: #111827;
      --playhead-glow: none;
      --badge-bg: #111827;
      --badge-text: #F7F8FA;
      --wheel-bg: #FFFFFF;
      --overlay-panel: rgba(247,248,250,0.92);
      --lock-bg: rgba(255,255,255,0.72);
      --lock-bg-strong: rgba(255,255,255,0.88);
    }
    html[data-theme="light"] #fs-lock { border: 1px solid var(--border); }
    html[data-theme="light"] .wheel-highlight {
      border-top-color: rgba(91,140,255,0.55);
      border-bottom-color: rgba(91,140,255,0.55);
      background: rgba(91,140,255,0.16);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      gap: 8px;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }
    #header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-height: 22px;
      flex-shrink: 0;
    }
    #title {
      font-size: 15px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #stage-wrap {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      background: #000;
    }
    #playfield { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #controls {
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row.wrap { flex-wrap: wrap; }
    button, label {
      font: inherit;
    }
    button:disabled { cursor: not-allowed; opacity: .4; }
    #play-button {
      width: 40px;
      height: 40px;
      min-width: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      border: 0;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    #play-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .transport-group {
      justify-content: center;
    }
    .transport-side {
      flex: 1;
      display: flex;
      gap: 4px;
    }
    .transport-side.left { justify-content: flex-end; }
    .transport-side.right { justify-content: flex-start; }
    .transport-btn {
      width: 36px;
      height: 36px;
      min-width: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      background: transparent;
      border: 0;
      color: var(--muted);
      cursor: pointer;
    }
    .transport-btn:active { color: var(--accent); }
    .transport-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    #time-label {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    #timeline-host {
      flex: 1;
      position: relative;
      height: 36px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    #timeline-bars {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      height: 22px;
      overflow: hidden;
    }
    .timeline-bar {
      position: absolute;
      bottom: 0;
      min-width: 1px;
      display: flex;
      flex-direction: column-reverse;
    }
    #timeline-ruler {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      height: 10px;
    }
    .timeline-tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }
    .timeline-tick.major { height: 8px; background: var(--accent); }
    .timeline-tick.medium { height: 5px; }
    .timeline-tick.minor { height: 3px; }
    .timeline-label {
      position: absolute;
      bottom: -9px;
      font-size: 8px;
      color: var(--muted);
      font-family: monospace;
      transform: translateX(-50%);
    }
    #timeline-playhead {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 2px;
      background: var(--playhead);
      box-shadow: var(--playhead-glow);
      pointer-events: none;
      transform: translateX(-1px);
      z-index: 10;
    }
    #timeline-badge {
      position: absolute;
      top: -16px;
      transform: translateX(-50%);
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 10px;
      font-family: monospace;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .wheel-trigger {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 26px;
      padding: 0 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      font-family: inherit;
    }
    .wheel-trigger.text {
      width: 54px;
      min-width: 54px;
      flex-shrink: 0;
      font-variant-numeric: normal;
    }
    .wheel-trigger:active { opacity: 0.7; }
    .wheel-popup {
      position: fixed;
      z-index: 1000;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    }
    .wheel-popup .wheel {
      border-radius: 12px;
    }
    .wheel {
      position: relative;
      width: 72px;
      height: calc(var(--wheel-item-h) * 3);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--wheel-bg);
      overflow: hidden;
      touch-action: pan-y;
    }
    .wheel-viewport {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .wheel-viewport::-webkit-scrollbar { display: none; }
    .wheel-list {
      padding: var(--wheel-item-h) 0;
    }
    .wheel-item {
      height: var(--wheel-item-h);
      line-height: var(--wheel-item-h);
      text-align: center;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      scroll-snap-align: center;
    }
    .wheel-item[aria-selected="true"] {
      color: var(--text);
      font-weight: 700;
    }
    .wheel-highlight {
      pointer-events: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: var(--wheel-item-h);
      transform: translateY(-50%);
      border-top: 1px solid rgba(91, 140, 255, 0.45);
      border-bottom: 1px solid rgba(91, 140, 255, 0.45);
      background: rgba(91, 140, 255, 0.12);
    }
    .toggle {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .toggle[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    body.fullscreen #app { padding: 0; gap: 0; }
    body.fullscreen #header { display: none; }
    body.fullscreen #stage-wrap {
      position: absolute;
      inset: 0;
      border: 0;
      border-radius: 0;
    }
    body.fullscreen .stage {
      aspect-ratio: 16 / 9;
      width: min(100vw, calc(100vh * 16 / 9));
      height: auto;
    }
    body.fullscreen #controls {
      position: absolute;
      z-index: 8;
      inset: auto 0 0;
      border: 0;
      border-radius: 0;
      background: var(--overlay-panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      transition: translate 220ms ease, opacity 220ms ease;
    }
    body.fullscreen #controls.hidden { translate: 0 100%; opacity: 0; pointer-events: none; }
    body.fullscreen .controls-settings { display: none; }
    #fs-lock {
      display: none;
      position: fixed;
      right: calc(10px + env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      z-index: 2001;
      width: 36px;
      height: 36px;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--lock-bg);
      color: var(--muted);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex: 0 0 36px;
      transition: opacity 220ms ease;
    }
    body.fullscreen #fs-lock { display: flex; }
    #fs-lock.hidden { opacity: 0; pointer-events: none; }
    #fs-lock.locked { color: var(--accent); background: var(--lock-bg-strong); }
    #fs-lock svg { width: 18px; height: 18px; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  
    [hidden] { display: none !important; }
    .notice { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; flex-shrink: 0; }
    .notice:empty, body.fullscreen .notice { display: none; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    body.fullscreen #app { overflow: hidden; }
  </style>
</head>
<body>
  <div id="app">
    <header id="header"><span id="title">谱面确认</span><span id="status" role="status">正在准备播放</span></header>
    <p id="mode-notice" class="notice" role="status"></p>
    <div id="stage-wrap">
      <section class="stage" id="stage" aria-label="谱面确认舞台"><canvas id="playfield" width="1280" height="720" aria-hidden="true"></canvas></section>
    </div>
    <p id="media-notice" class="notice" role="status"></p>
    <section id="controls" aria-label="播放控制">
      <div class="row">
        <div id="timeline-host" role="slider" tabindex="0" aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-disabled="true">
          <div id="timeline-bars"></div>
          <div id="timeline-ruler"></div>
          <div id="timeline-playhead"></div>
          <div id="timeline-badge"></div>
        </div>
      </div>
      <div class="row" style="justify-content:center">
        <span id="time-label">0:00 / 0:00</span>
      </div>
      <div class="row transport-group">
        <div class="transport-side left">
          <button class="transport-btn" id="btn-restart" type="button" aria-label="重播" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h12"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H5"/></svg>
          </button>
          <button class="transport-btn" id="btn-step-back" type="button" aria-label="步退" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </div>
        <button id="play-button" type="button" aria-label="播放" disabled>
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="transport-side right">
          <button class="transport-btn" id="btn-step-forward" type="button" aria-label="步进" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="transport-btn" id="btn-fullscreen" type="button" aria-label="进入全屏" title="全屏" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M21 8V5a2 2 0 00-2-2h-3"/><path d="M3 16v3a2 2 0 002 2h3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>
          </button>
        </div>
      </div>
      <div class="row wrap controls-settings">
        <div class="field wheel-field"><span>背景亮度</span>
          <button class="wheel-trigger" id="brightness-trigger" type="button" aria-label="背景亮度" disabled><span id="brightness-val">20%</span></button>
          <div class="wheel-popup" id="brightness-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="背景亮度拨轮">
              <div class="wheel-viewport" id="brightness-wheel" role="listbox" tabindex="0" aria-label="背景亮度"><div class="wheel-list" id="brightness-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field"><span>背景模糊</span>
          <button class="wheel-trigger" id="blur-trigger" type="button" aria-label="背景模糊" disabled><span id="blur-val">0 px</span></button>
          <div class="wheel-popup" id="blur-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="背景模糊拨轮">
              <div class="wheel-viewport" id="blur-wheel" role="listbox" tabindex="0" aria-label="背景模糊"><div class="wheel-list" id="blur-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" data-mode="3" hidden><span>mania 样式</span>
          <button class="wheel-trigger" id="mania-skin-trigger" type="button" aria-label="mania 样式" disabled><span id="mania-skin-val">砖块</span></button>
          <div class="wheel-popup" id="mania-skin-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="mania 样式拨轮">
              <div class="wheel-viewport" id="mania-skin-wheel" role="listbox" tabindex="0" aria-label="mania 样式"><div class="wheel-list" id="mania-skin-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" data-mode="3" hidden><span>流速</span>
          <button class="wheel-trigger" id="scroll-speed-trigger" type="button" aria-label="流速" disabled><span id="scroll-speed-val">8.0</span></button>
          <div class="wheel-popup" id="scroll-speed-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="流速拨轮">
              <div class="wheel-viewport" id="scroll-speed-wheel" role="listbox" tabindex="0" aria-label="流速"><div class="wheel-list" id="scroll-speed-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" data-mode="3" hidden><span>Hold 宽度</span>
          <button class="wheel-trigger" id="hold-width-trigger" type="button" aria-label="Hold 宽度" disabled><span id="hold-width-val">60%</span></button>
          <div class="wheel-popup" id="hold-width-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="Hold 宽度拨轮">
              <div class="wheel-viewport" id="hold-width-wheel" role="listbox" tabindex="0" aria-label="Hold 宽度"><div class="wheel-list" id="hold-width-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" data-mode="3" hidden><span>轨道不透明度</span>
          <button class="wheel-trigger" id="mania-track-opacity-trigger" type="button" aria-label="轨道不透明度" disabled><span id="mania-track-opacity-val">100%</span></button>
          <div class="wheel-popup" id="mania-track-opacity-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="轨道不透明度拨轮">
              <div class="wheel-viewport" id="mania-track-opacity-wheel" role="listbox" tabindex="0" aria-label="轨道不透明度"><div class="wheel-list" id="mania-track-opacity-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" data-mode="1" hidden><span>轨道不透明度</span>
          <button class="wheel-trigger" id="taiko-track-opacity-trigger" type="button" aria-label="轨道不透明度" disabled><span id="taiko-track-opacity-val">100%</span></button>
          <div class="wheel-popup" id="taiko-track-opacity-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="轨道不透明度拨轮">
              <div class="wheel-viewport" id="taiko-track-opacity-wheel" role="listbox" tabindex="0" aria-label="轨道不透明度"><div class="wheel-list" id="taiko-track-opacity-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row wrap controls-settings">
        <button class="toggle" id="storyboard-enabled" type="button" aria-pressed="true" hidden disabled>故事板</button>
        <button class="toggle" id="video-enabled" type="button" aria-pressed="true" hidden disabled>背景视频</button>
        <button class="toggle" id="mania-ignore-sv" type="button" data-mode="3" aria-pressed="false" hidden disabled>无视 SV</button>
      </div>
    </section>
  </div>
  <button id="fs-lock" type="button" aria-label="锁定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
  </button>
  <!--OSU_CHART_PREVIEW_CONFIG-->
  <script>(function(){var c=window.__OSU_CHART_PREVIEW_CONFIG__;if(c&&c.theme==='light'){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <!--PLAYER_SCRIPT-->
</body>
</html>
