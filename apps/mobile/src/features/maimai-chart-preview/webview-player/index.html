<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>谱面确认</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #161a22;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #5b8cff;
      --border: #2a3140;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      gap: 8px;
    }
    #header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-height: 24px;
    }
    #title {
      font-size: 15px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    #canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    #chart-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #controls {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row.wrap { flex-wrap: wrap; }
    button, label, input[type="range"] {
      font: inherit;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      padding: 8px 16px;
      min-width: 72px;
    }
    #seek { flex: 1; }
    #time-label {
      font-size: 12px;
      color: var(--muted);
      min-width: 88px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .field input[type="range"] { width: 88px; }
    .field input[type="checkbox"] { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="title">谱面确认</div>
      <div id="status">准备中…</div>
    </div>
    <div id="canvas-wrap">
      <canvas id="chart-canvas"></canvas>
    </div>
    <div id="controls">
      <div class="row">
        <button id="play" type="button">播放</button>
        <input id="seek" type="range" min="0" max="1" step="0.001" value="0" />
        <div id="time-label">0:00 / 0:00</div>
      </div>
      <div class="row wrap">
        <label class="field">流速 <input id="hi-speed" type="range" min="3" max="9" step="0.25" value="6" /></label>
        <label class="field">倍速 <input id="playback-speed" type="range" min="0.25" max="1" step="0.05" value="1" /></label>
        <label class="field"><input id="music-enabled" type="checkbox" checked /> 音乐</label>
        <label class="field"><input id="sound-enabled" type="checkbox" checked /> 正解音</label>
        <label class="field">乐音 <input id="music-volume" type="range" min="0" max="1" step="0.05" value="0.8" /></label>
        <label class="field">打击 <input id="sound-volume" type="range" min="0" max="1" step="0.05" value="0.6" /></label>
      </div>
    </div>
  </div>
  <!--PLAYER_SCRIPT-->
</body>
</html>
