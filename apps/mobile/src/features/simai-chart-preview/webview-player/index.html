<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>谱面确认</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #161a22;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #5b8cff;
      --border: #2a3140;
      --wheel-item-h: 28px;
      --playhead: #fff;
      --playhead-glow: 0 0 8px rgba(255,255,255,0.7);
      --thumb-glow: 0 0 6px rgba(255,255,255,0.6);
      --badge-bg: #fff;
      --badge-text: #0b0d12;
      --wheel-bg: #0f131a;
      --overlay-panel: rgba(11,13,18,0.92);
      --lock-bg: rgba(11,13,18,0.6);
      --lock-bg-strong: rgba(11,13,18,0.8);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #F7F8FA;
      --panel: #FFFFFF;
      --text: #111827;
      --muted: #6B7280;
      --border: #D1D5DB;
      --playhead: #111827;
      --playhead-glow: none;
      --thumb-glow: none;
      --badge-bg: #111827;
      --badge-text: #F7F8FA;
      --wheel-bg: #FFFFFF;
      --overlay-panel: rgba(247,248,250,0.92);
      --lock-bg: rgba(255,255,255,0.72);
      --lock-bg-strong: rgba(255,255,255,0.88);
    }
    html[data-theme="light"] #fs-lock { border: 1px solid var(--border); }
    html[data-theme="light"] .wheel-highlight {
      border-top-color: rgba(91,140,255,0.55);
      border-bottom-color: rgba(91,140,255,0.55);
      background: rgba(91,140,255,0.16);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      gap: 8px;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }
    #header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-height: 24px;
      flex-shrink: 0;
    }
    #title {
      font-size: 15px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    #canvas-wrap {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    #canvas-stage {
      position: relative;
      width: 0;
      height: 0;
      flex-shrink: 0;
    }
    #canvas-stage-2 {
      display: none;
      position: relative;
      width: 0;
      height: 0;
      flex-shrink: 0;
    }
    body.dual #canvas-wrap {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    body.dual #canvas-stage-2 {
      display: block;
    }
    .side-chip {
      display: none;
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 5;
      background: rgba(11, 13, 18, 0.72);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      pointer-events: none;
    }
    body.dual .side-chip {
      display: block;
    }
    #chart-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #chart-canvas-2 {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #controls {
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row.wrap { flex-wrap: wrap; }
    button, label, input[type="range"] {
      font: inherit;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      padding: 8px 16px;
      min-width: 72px;
    }
    #play,
    #fs-play,
    .play-toggle {
      width: 40px;
      height: 40px;
      min-width: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #play svg,
    #fs-play svg,
    .play-toggle svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .transport-group {
      justify-content: center;
    }
    .transport-side {
      flex: 1;
      display: flex;
      gap: 4px;
    }
    .transport-side.left { justify-content: flex-end; }
    .transport-side.right { justify-content: flex-start; }
    .transport-btn {
      width: 36px;
      height: 36px;
      min-width: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      background: transparent;
      border: 0;
      color: var(--muted);
      cursor: pointer;
    }
    .transport-btn:active { color: var(--accent); }
    .loop-row {
      justify-content: center;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .loop-btn {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 3px 14px;
      cursor: pointer;
      font-family: monospace;
      min-width: 36px;
    }
    .loop-btn.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .loop-sep { margin: 0 2px; }
    body.fullscreen #header,
    body.fullscreen #info-bar,
    body.fullscreen #controls { display: none; }
    body.fullscreen #app {
      padding: 0;
      gap: 0;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    body.fullscreen #canvas-wrap {
      border: 0;
      border-radius: 0;
    }
    #fs-overlay {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2000;
      background: var(--overlay-panel);
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: translate 220ms ease, opacity 220ms ease;
      touch-action: none;
    }
    body.fullscreen #fs-overlay { display: flex; }
    #fs-overlay.hidden { translate: 0 100%; opacity: 0; pointer-events: none; }
    #fs-lock {
      display: none;
      position: fixed;
      right: calc(10px + env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      z-index: 2001;
      width: 36px;
      height: 36px;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--lock-bg);
      color: var(--muted);
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex: 0 0 36px;
      transition: opacity 220ms ease;
    }
    body.fullscreen #fs-lock { display: flex; }
    #fs-lock.hidden { opacity: 0; pointer-events: none; }
    #fs-lock.locked { color: var(--accent); background: var(--lock-bg-strong); }
    #fs-lock svg { width: 18px; height: 18px; }
    #fs-timeline-host {
      position: relative;
      height: 36px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    #fs-timeline-bars {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      height: 22px;
      overflow: hidden;
    }
    #fs-timeline-ruler {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      height: 10px;
    }
    #fs-timeline-playhead {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 2px;
      background: var(--playhead);
      box-shadow: var(--playhead-glow);
      pointer-events: none;
      transform: translateX(-1px);
      z-index: 10;
    }
    #fs-timeline-badge {
      position: absolute;
      top: -16px;
      transform: translateX(-50%);
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 10px;
      font-family: monospace;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
    .fs-timeline-tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }
    .fs-timeline-tick.major { height: 8px; background: var(--accent); }
    .fs-timeline-tick.medium { height: 5px; }
    .fs-timeline-tick.minor { height: 3px; }
    .fs-timeline-label {
      position: absolute;
      bottom: -9px;
      font-size: 8px;
      color: var(--muted);
      font-family: monospace;
      transform: translateX(-50%);
    }
    .fs-timeline-bar {
      position: absolute;
      bottom: 0;
      min-width: 1px;
      display: flex;
      flex-direction: column-reverse;
    }
    .transport-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    #seek { flex: 1; }
    #seek {
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      outline: none;
    }
    #seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 8px;
      height: 18px;
      border-radius: 3px;
      background: var(--playhead);
      border: 0;
      box-shadow: var(--thumb-glow);
      cursor: pointer;
    }
    #seek::-moz-range-thumb {
      width: 8px;
      height: 18px;
      border-radius: 3px;
      background: var(--playhead);
      border: 0;
      box-shadow: var(--thumb-glow);
      cursor: pointer;
    }
    #timeline-host {
      flex: 1;
      position: relative;
      height: 36px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    #timeline-bars {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      height: 22px;
      overflow: hidden;
    }
    .timeline-bar {
      position: absolute;
      bottom: 0;
      min-width: 1px;
      display: flex;
      flex-direction: column-reverse;
    }
    #timeline-ruler {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      height: 10px;
    }
    .timeline-tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }
    .timeline-tick.major { height: 8px; background: var(--accent); }
    .timeline-tick.medium { height: 5px; }
    .timeline-tick.minor { height: 3px; }
    .timeline-label {
      position: absolute;
      bottom: -9px;
      font-size: 8px;
      color: var(--muted);
      font-family: monospace;
      transform: translateX(-50%);
    }
    #timeline-playhead {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 2px;
      background: var(--playhead);
      box-shadow: var(--playhead-glow);
      pointer-events: none;
      transform: translateX(-1px);
      z-index: 10;
    }
    #timeline-badge {
      position: absolute;
      top: -16px;
      transform: translateX(-50%);
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 10px;
      font-family: monospace;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
    #info-bar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .info-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 0 10px;
      height: 14px;
      overflow: hidden;
    }
    .info-item { white-space: nowrap; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .info-item.static { flex-shrink: 0; }
    .info-val { color: var(--text); font-variant-numeric: tabular-nums; }
    .info-fps-green { color: #22c55e; }
    .info-fps-yellow { color: #eab308; }
    .info-fps-red { color: #ef4444; }
    #time-label {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .field input[type="range"] { width: 88px; }
    .wheel-field {
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .wheel-trigger {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 26px;
      padding: 0 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      font-family: inherit;
    }
    .wheel-trigger.text {
      width: 54px;
      min-width: 54px;
      flex-shrink: 0;
      font-variant-numeric: normal;
    }
    .wheel-trigger.text.wide {
      width: 68px;
      min-width: 68px;
    }
    .wheel-trigger:active { opacity: 0.7; }
    .wheel-popup {
      position: fixed;
      z-index: 1000;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    }
    .wheel-popup .wheel {
      border-radius: 12px;
    }
    .wheel {
      position: relative;
      width: 72px;
      height: calc(var(--wheel-item-h) * 3);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--wheel-bg);
      overflow: hidden;
      touch-action: pan-y;
    }
    .wheel-viewport {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .wheel-viewport::-webkit-scrollbar { display: none; }
    .wheel-list {
      padding: var(--wheel-item-h) 0;
    }
    .wheel-item {
      height: var(--wheel-item-h);
      line-height: var(--wheel-item-h);
      text-align: center;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      scroll-snap-align: center;
    }
    .wheel-item[aria-selected="true"] {
      color: var(--text);
      font-weight: 700;
    }
    .wheel-highlight {
      pointer-events: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: var(--wheel-item-h);
      transform: translateY(-50%);
      border-top: 1px solid rgba(91, 140, 255, 0.45);
      border-bottom: 1px solid rgba(91, 140, 255, 0.45);
      background: rgba(91, 140, 255, 0.12);
    }
    .toggle {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .toggle[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .section-divider {
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="title">谱面确认</div>
      <div id="status">准备中…</div>
    </div>
    <div id="info-bar">
      <div class="info-row">
        <span class="info-item">BPM: <span class="info-val" id="info-bpm">--</span></span>
        <span class="info-item"><span class="info-val" id="info-beat">0:0.00</span></span>
        <span class="info-item"><span class="info-val" id="info-fps">--</span></span>
      </div>
      <div class="info-row">
        <span class="info-item">COMBO: <span class="info-val" id="info-combo">0 / 0</span></span>
        <span class="info-item" id="info-break-wrap" style="display:none">BREAK: <span class="info-val" id="info-break">0 / 0</span></span>
        <span class="info-item" id="info-break-noex-wrap" style="display:none">（无保护套 <span class="info-val" id="info-break-noex">0 / 0</span>）</span>
      </div>
    </div>
    <div id="canvas-wrap">
      <div id="canvas-stage">
        <span class="side-chip">1P</span>
        <canvas id="chart-canvas"></canvas>
      </div>
      <div id="canvas-stage-2">
        <span class="side-chip">2P</span>
        <canvas id="chart-canvas-2"></canvas>
      </div>
    </div>
    <img id="background-image" alt="" hidden />
    <video id="background-video" muted playsinline preload="metadata" hidden></video>
    <div id="controls">
      <div class="row">
        <div id="timeline-host">
          <div id="timeline-bars"></div>
          <div id="timeline-ruler"></div>
          <div id="timeline-playhead"></div>
          <div id="timeline-badge"></div>
        </div>
      </div>
      <div class="row" style="justify-content:center">
        <div id="time-label" style="min-width:auto;text-align:center">0:00 / 0:00</div>
      </div>
      <div class="row transport-group">
        <div class="transport-side left">
          <button class="transport-btn" id="btn-restart" type="button" aria-label="重播当前小节">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h12"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H5"/></svg>
          </button>
          <button class="transport-btn" id="btn-prev-measure" type="button" aria-label="上一小节">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
          </button>
          <button class="transport-btn" id="btn-step-back" type="button" aria-label="步退">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </div>
        <button id="play" type="button" aria-label="播放">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="transport-side right">
          <button class="transport-btn" id="btn-step-forward" type="button" aria-label="步进">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="transport-btn" id="btn-next-measure" type="button" aria-label="下一小节">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
          </button>
          <button class="transport-btn" id="btn-fullscreen" type="button" aria-label="全屏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M21 8V5a2 2 0 00-2-2h-3"/><path d="M3 16v3a2 2 0 002 2h3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>
          </button>
        </div>
      </div>
      <div class="row loop-row">
        <button class="loop-btn" id="btn-loop-a" type="button">A</button>
        <span class="loop-sep">⇌</span>
        <button class="loop-btn" id="btn-loop-b" type="button">B</button>
      </div>
      <div class="row wrap">
        <div class="field wheel-field" id="hi-speed-field">
          流速
          <button class="wheel-trigger" id="hi-speed-trigger" type="button">
            <span id="hi-speed-val">6.0</span>
          </button>
          <div class="wheel-popup" id="hi-speed-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="流速滚轮">
              <div class="wheel-viewport" id="hi-speed-wheel">
                <div class="wheel-list" id="hi-speed-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="speed-field">
          倍速
          <button class="wheel-trigger" id="speed-trigger" type="button">
            <span id="speed-val">1.0</span>
          </button>
          <div class="wheel-popup" id="speed-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="倍速滚轮">
              <div class="wheel-viewport" id="speed-wheel">
                <div class="wheel-list" id="speed-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="music-vol-field">
          音乐
          <button class="wheel-trigger" id="music-vol-trigger" type="button">
            <span id="music-vol-val">10.0</span>
          </button>
          <div class="wheel-popup" id="music-vol-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="音乐音量">
              <div class="wheel-viewport" id="music-vol-wheel">
                <div class="wheel-list" id="music-vol-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="sound-vol-field">
          打击音
          <button class="wheel-trigger" id="sound-vol-trigger" type="button">
            <span id="sound-vol-val">10.0</span>
          </button>
          <div class="wheel-popup" id="sound-vol-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="打击音音量">
              <div class="wheel-viewport" id="sound-vol-wheel">
                <div class="wheel-list" id="sound-vol-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row wrap section-divider">
        <div class="field wheel-field" id="mirror-field">
          镜像
          <button class="wheel-trigger text" id="mirror-trigger" type="button">
            <span id="mirror-val">无</span>
          </button>
          <div class="wheel-popup" id="mirror-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="镜像选项">
              <div class="wheel-viewport" id="mirror-wheel">
                <div class="wheel-list" id="mirror-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="style-field">
          款式
          <button class="wheel-trigger text" id="style-trigger" type="button">
            <span id="style-val">判定区</span>
          </button>
          <div class="wheel-popup" id="style-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="款式选项">
              <div class="wheel-viewport" id="style-wheel">
                <div class="wheel-list" id="style-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="judge-hint-field">
          判定提示
          <button class="wheel-trigger text wide" id="judge-hint-trigger" type="button">
            <span id="judge-hint-val">区分</span>
          </button>
          <div class="wheel-popup" id="judge-hint-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="判定提示">
              <div class="wheel-viewport" id="judge-hint-wheel">
                <div class="wheel-list" id="judge-hint-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="background-field">
          背景
          <button class="wheel-trigger text wide" id="background-trigger" type="button">
            <span id="background-val">无背景</span>
          </button>
          <div class="wheel-popup" id="background-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="背景选项">
              <div class="wheel-viewport" id="background-wheel">
                <div class="wheel-list" id="background-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row wrap">
        <button class="toggle" id="toggle-pink" type="button">粉色星星头</button>
        <button class="toggle" id="toggle-star-rot" type="button">星星头旋转</button>
        <button class="toggle" id="toggle-ex" type="button">高亮保护套</button>
        <button class="toggle" id="toggle-break-slide" type="button">标准色绝赞</button>
        <button class="toggle" id="toggle-hit" type="button">打击特效</button>
        <button class="toggle" id="toggle-firework" type="button">烟花特效</button>
      </div>
    </div>
  </div>
  <div id="fs-overlay" class="hidden">
    <div id="fs-timeline-host">
      <div id="fs-timeline-bars"></div>
      <div id="fs-timeline-ruler"></div>
      <div id="fs-timeline-playhead"></div>
      <div id="fs-timeline-badge"></div>
    </div>
    <div class="row" style="justify-content:center">
      <div style="font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums" id="fs-time-label">0:00 / 0:00</div>
    </div>
    <div class="row transport-group" id="fs-transport">
    </div>
    <div class="row loop-row" style="margin-top:2px">
      <button class="loop-btn" id="fs-loop-a" type="button">A</button>
      <span class="loop-sep">⇌</span>
      <button class="loop-btn" id="fs-loop-b" type="button">B</button>
    </div>
  </div>
  <button id="fs-lock" type="button" aria-label="锁定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
  </button>
  <!--CHART_PREVIEW_CONFIG-->
  <script>(function(){var c=window.__CHART_PREVIEW__;if(c&&c.theme==='light'){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <!--PLAYER_SCRIPT-->
</body>
</html>
