<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>谱面确认</title>
  <style>
    /*PREVIEW_STYLE*/
    :root {
      --thumb-glow: 0 0 6px rgba(255,255,255,0.6);
    }

    html[data-theme="light"] {
      --thumb-glow: none;
    }

    html, body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #app {
      overflow-y: auto;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    #header {
      min-height: 24px;
    }

    #status {
      font-size: 12px;
    }

    #canvas-wrap {
      position: relative;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    #canvas-stage {
      position: relative;
      width: 0;
      height: 0;
      flex-shrink: 0;
    }

    #canvas-stage-2 {
      display: none;
      position: relative;
      width: 0;
      height: 0;
      flex-shrink: 0;
    }

    body.dual #canvas-wrap {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    body.dual #canvas-stage-2 {
      display: block;
    }

    .side-chip {
      display: none;
      position: absolute;
      top: 6px;
      left: 6px;
      z-index: 5;
      background: rgba(11, 13, 18, 0.72);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      pointer-events: none;
    }

    body.dual .side-chip {
      display: block;
    }

    #chart-canvas {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    button, label, input[type="range"] {
      font: inherit;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      padding: 8px 16px;
      min-width: 72px;
    }

    #play,
    #fs-play,
    .play-toggle {
      width: 40px;
      height: 40px;
      min-width: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #play svg,
    #fs-play svg,
    .play-toggle svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .loop-row {
      justify-content: center;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .loop-btn {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      padding: 3px 14px;
      cursor: pointer;
      font-family: monospace;
      min-width: 36px;
    }

    .loop-btn.on {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .loop-sep { margin: 0 2px; }

    body.fullscreen #header,
    body.fullscreen #info-bar,
    body.fullscreen #controls { display: none; }

    body.fullscreen #app {
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body.fullscreen #canvas-wrap {
      border: 0;
      border-radius: 0;
    }

    #fs-overlay {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2000;
      background: var(--overlay-panel);
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: translate 220ms ease, opacity 220ms ease;
      touch-action: none;
    }

    body.fullscreen #fs-overlay { display: flex; }

    #fs-overlay.hidden { translate: 0 100%; opacity: 0; pointer-events: none; }

    #fs-timeline-host {
      position: relative;
      height: 36px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }

    #fs-timeline-bars {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      height: 22px;
      overflow: hidden;
    }

    #fs-timeline-ruler {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      height: 10px;
    }

    #fs-timeline-playhead {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 2px;
      background: var(--playhead);
      box-shadow: var(--playhead-glow);
      pointer-events: none;
      transform: translateX(-1px);
      z-index: 10;
    }

    #fs-timeline-badge {
      position: absolute;
      top: -16px;
      transform: translateX(-50%);
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 10px;
      font-family: monospace;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }

    .fs-timeline-tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }

    .fs-timeline-tick.major { height: 8px; background: var(--accent); }

    .fs-timeline-tick.medium { height: 5px; }

    .fs-timeline-tick.minor { height: 3px; }

    .fs-timeline-label {
      position: absolute;
      bottom: -9px;
      font-size: 8px;
      color: var(--muted);
      font-family: monospace;
      transform: translateX(-50%);
    }

    .fs-timeline-bar {
      position: absolute;
      bottom: 0;
      min-width: 1px;
      display: flex;
      flex-direction: column-reverse;
    }

    #seek { flex: 1; }

    #seek {
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      outline: none;
    }

    #seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 8px;
      height: 18px;
      border-radius: 3px;
      background: var(--playhead);
      border: 0;
      box-shadow: var(--thumb-glow);
      cursor: pointer;
    }

    #seek::-moz-range-thumb {
      width: 8px;
      height: 18px;
      border-radius: 3px;
      background: var(--playhead);
      border: 0;
      box-shadow: var(--thumb-glow);
      cursor: pointer;
    }

    #info-bar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .info-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 0 10px;
      height: 14px;
      overflow: hidden;
    }

    .info-item { white-space: nowrap; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

    .info-item.static { flex-shrink: 0; }

    .info-val { color: var(--text); font-variant-numeric: tabular-nums; }

    .info-fps-green { color: #22c55e; }

    .info-fps-yellow { color: #eab308; }

    .info-fps-red { color: #ef4444; }

    .field input[type="range"] { width: 88px; }

    .wheel-field {
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .wheel-trigger.text.wide {
      width: 68px;
      min-width: 68px;
    }

    .section-divider {
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
  </style>
  <style>/*PREVIEW_CONTROLS_STYLE*/</style>
</head>
<body class="preview-controls">
  <div id="app">
    <div id="header">
      <div id="title">谱面确认</div>
      <div id="status">准备中…</div>
    </div>
    <div id="canvas-wrap">
      <canvas id="chart-canvas"></canvas>
      <div id="canvas-stage">
        <span class="side-chip">1P</span>
      </div>
      <div id="canvas-stage-2">
        <span class="side-chip">2P</span>
      </div>
    </div>
    <video id="background-video" muted playsinline preload="metadata" hidden></video>
    <template id="preview-details">
    <div id="info-bar">
      <div class="info-row">
        <span class="info-item">BPM: <span class="info-val" id="info-bpm">--</span></span>
        <span class="info-item"><span class="info-val" id="info-beat">0:0.00</span></span>
        <span class="info-item"><span class="info-val" id="info-fps">--</span></span>
      </div>
      <div class="info-row">
        <span class="info-item">COMBO: <span class="info-val" id="info-combo">0 / 0</span></span>
        <span class="info-item" id="info-break-wrap" style="display:none">BREAK: <span class="info-val" id="info-break">0 / 0</span></span>
        <span class="info-item" id="info-break-noex-wrap" style="display:none">（无保护套 <span class="info-val" id="info-break-noex">0 / 0</span>）</span>
      </div>
    </div>
    </template>
    <template id="preview-settings" data-measures>
      <section class="preview-section">
        <h3>播放与声音</h3>
        <div class="row wrap">
        <div class="field wheel-field" id="hi-speed-field">
          流速
          <button data-presentation="inline" class="wheel-trigger" id="hi-speed-trigger" type="button">
            <span id="hi-speed-val">6.0</span>
          </button>
          <!--PREVIEW_WHEEL hi-speed|aria-label="流速滚轮"|-->
        </div>
        <div class="field wheel-field" id="speed-field">
          倍速
          <button data-presentation="inline" class="wheel-trigger" id="speed-trigger" type="button">
            <span id="speed-val">1.0</span>
          </button>
          <!--PREVIEW_WHEEL speed|aria-label="倍速滚轮"|-->
        </div>
        <div class="field wheel-field" id="music-vol-field">
          音乐
          <button data-presentation="inline" class="wheel-trigger" id="music-vol-trigger" type="button">
            <span id="music-vol-val">10.0</span>
          </button>
          <!--PREVIEW_WHEEL music-vol|aria-label="音乐音量"|-->
        </div>
        <div class="field wheel-field" id="sound-vol-field">
          打击音
          <button data-presentation="inline" class="wheel-trigger" id="sound-vol-trigger" type="button">
            <span id="sound-vol-val">10.0</span>
          </button>
          <!--PREVIEW_WHEEL sound-vol|aria-label="打击音音量"|-->
        </div>
      </div>
      </section>
      <section class="preview-section">
        <h3>画面与判定</h3>
        <div class="row wrap section-divider">
        <div class="field wheel-field" id="mirror-field">
          镜像
          <button data-presentation="inline" class="wheel-trigger text" id="mirror-trigger" type="button">
            <span id="mirror-val">无</span>
          </button>
          <!--PREVIEW_WHEEL mirror|aria-label="镜像选项"|-->
        </div>
        <div class="field wheel-field" id="style-field">
          款式
          <button data-presentation="inline" class="wheel-trigger text" id="style-trigger" type="button">
            <span id="style-val">判定区</span>
          </button>
          <!--PREVIEW_WHEEL style|aria-label="款式选项"|-->
        </div>
        <div class="field wheel-field" id="judge-hint-field">
          判定提示
          <button data-presentation="inline" class="wheel-trigger text wide" id="judge-hint-trigger" type="button">
            <span id="judge-hint-val">区分</span>
          </button>
          <!--PREVIEW_WHEEL judge-hint|aria-label="判定提示"|-->
        </div>
        <div class="field wheel-field" id="background-field">
          背景
          <button data-presentation="inline" class="wheel-trigger text wide" id="background-trigger" type="button">
            <span id="background-val">无背景</span>
          </button>
          <!--PREVIEW_WHEEL background|aria-label="背景选项"|-->
        </div>
      </div>
      </section>
      <section class="preview-section">
        <h3>视觉效果</h3>
        <div class="row wrap">
        <button class="toggle" id="toggle-pink" type="button">粉色星星头</button>
        <button class="toggle" id="toggle-star-rot" type="button">星星头旋转</button>
        <button class="toggle" id="toggle-hit" type="button">打击特效</button>
        <button class="toggle" id="toggle-firework" type="button">烟花特效</button>
      </div>
      </section>
    </template>
  </div>
  <div id="fs-overlay" class="hidden">
    <div id="fs-timeline-host">
      <div id="fs-timeline-bars"></div>
      <div id="fs-timeline-ruler"></div>
      <div id="fs-timeline-playhead"></div>
      <div id="fs-timeline-badge"></div>
    </div>
    <div class="row" style="justify-content:center">
      <div style="font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums" id="fs-time-label">0:00 / 0:00</div>
    </div>
    <!--PREVIEW_FULLSCREEN_TRANSPORT-->
    <div class="row loop-row" style="margin-top:2px">
      <button class="loop-btn" id="fs-loop-a" type="button">A</button>
      <span class="loop-sep">⇌</span>
      <button class="loop-btn" id="fs-loop-b" type="button">B</button>
    </div>
  </div>
  <!--PREVIEW_LOCK-->
  <!--CHART_PREVIEW_CONFIG-->
  <script>(function(){var c=window.__CHART_PREVIEW__;if(c&&c.theme==='light'){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <!--PLAYER_SCRIPT-->
</body>
</html>
