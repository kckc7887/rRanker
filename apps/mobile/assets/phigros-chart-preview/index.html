<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>谱面确认</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #161a22;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #5b8cff;
      --border: #2a3140;
      --wheel-item-h: 28px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      gap: 8px;
    }
    #header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-height: 22px;
      flex-shrink: 0;
    }
    #title {
      font-size: 15px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #stage-wrap {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      isolation: isolate;
      background: #000;
    }
    #chart-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .game-hud { position: absolute; z-index: 3; inset: 0; pointer-events: none; text-shadow: 0 1px 5px rgba(0,0,0,.72); }
    .game-progress { position: absolute; top: 0; left: 0; width: 100%; height: var(--progress-height, 3px); background: rgba(255,255,255,.1); }
    .game-progress i { display: block; width: 0; height: 100%; background: rgba(255,255,255,.72); box-shadow: 0 0 5px #fff; }
    .score-block { position: absolute; top: 10px; right: 12px; display: grid; justify-items: end; line-height: 1; }
    .score-block strong { font-size: var(--score-font-size, 22px); font-weight: 600; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
    .combo-block { position: absolute; top: 14px; left: 50%; translate: -50% 0; display: none; justify-items: center; line-height: .9; }
    .combo-block.is-visible { display: grid; }
    .combo-block strong { font-size: var(--combo-font-size, 26px); font-weight: 600; font-variant-numeric: tabular-nums; }
    .combo-block span { margin-top: .55em; font-size: var(--combo-label-font-size, 8px); letter-spacing: .08em; opacity: .85; }

    /* ---- 下方播放控制器：样式与交互对齐舞萌谱面确认 ---- */
    #controls {
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row.wrap { flex-wrap: wrap; }
    button, label {
      font: inherit;
    }
    button:disabled { cursor: not-allowed; opacity: .4; }
    #play-button {
      width: 40px;
      height: 40px;
      min-width: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      border: 0;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    #play-button svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    .transport-group {
      justify-content: center;
    }
    .transport-side {
      flex: 1;
      display: flex;
      gap: 4px;
    }
    .transport-side.left { justify-content: flex-end; }
    .transport-side.right { justify-content: flex-start; }
    .transport-btn {
      width: 36px;
      height: 36px;
      min-width: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
      background: transparent;
      border: 0;
      color: var(--muted);
      cursor: pointer;
    }
    .transport-btn:active { color: var(--accent); }
    .transport-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    #time-label {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    /* 时间轴：舞萌式音符密度条 + 刻度 + 播放头 */
    #timeline-host {
      flex: 1;
      position: relative;
      height: 36px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    #timeline-bars {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      height: 22px;
      overflow: hidden;
    }
    .timeline-bar {
      position: absolute;
      bottom: 0;
      min-width: 1px;
      display: flex;
      flex-direction: column-reverse;
    }
    #timeline-ruler {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      height: 10px;
    }
    .timeline-tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }
    .timeline-tick.major { height: 8px; background: var(--accent); }
    .timeline-tick.medium { height: 5px; }
    .timeline-tick.minor { height: 3px; }
    .timeline-label {
      position: absolute;
      bottom: -9px;
      font-size: 8px;
      color: var(--muted);
      font-family: monospace;
      transform: translateX(-50%);
    }
    #timeline-playhead {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 2px;
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.7);
      pointer-events: none;
      transform: translateX(-1px);
      z-index: 10;
    }
    #timeline-badge {
      position: absolute;
      top: -16px;
      transform: translateX(-50%);
      background: #fff;
      color: #0b0d12;
      font-size: 10px;
      font-family: monospace;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
    /* 拨轮：舞萌式触发钮 + 滚动吸附滚轮 */
    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .wheel-trigger {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 26px;
      padding: 0 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      font-family: inherit;
    }
    .wheel-trigger.text {
      width: 54px;
      min-width: 54px;
      flex-shrink: 0;
      font-variant-numeric: normal;
    }
    .wheel-trigger:active { opacity: 0.7; }
    .wheel-popup {
      position: fixed;
      z-index: 1000;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    }
    .wheel-popup .wheel {
      border-radius: 12px;
    }
    .wheel {
      position: relative;
      width: 72px;
      height: calc(var(--wheel-item-h) * 3);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f131a;
      overflow: hidden;
      touch-action: pan-y;
    }
    .wheel-viewport {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .wheel-viewport::-webkit-scrollbar { display: none; }
    .wheel-list {
      padding: var(--wheel-item-h) 0;
    }
    .wheel-item {
      height: var(--wheel-item-h);
      line-height: var(--wheel-item-h);
      text-align: center;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      scroll-snap-align: center;
    }
    .wheel-item[aria-selected="true"] {
      color: var(--text);
      font-weight: 700;
    }
    .wheel-highlight {
      pointer-events: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: var(--wheel-item-h);
      transform: translateY(-50%);
      border-top: 1px solid rgba(91, 140, 255, 0.45);
      border-bottom: 1px solid rgba(91, 140, 255, 0.45);
      background: rgba(91, 140, 255, 0.12);
    }
    .toggle {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .toggle[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    body.fullscreen #app { padding: 0; gap: 0; }
    body.fullscreen #header { display: none; }
    body.fullscreen #stage-wrap {
      position: absolute;
      inset: 0;
      border: 0;
      border-radius: 0;
    }
    /* 横屏全屏时播放窗保持 16:9 比例，只按视口适配缩放（黑边填充）。 */
    body.fullscreen .stage {
      aspect-ratio: 16 / 9;
      width: min(100vw, calc(100vh * 16 / 9));
      height: auto;
    }
    /* 全屏控制层与舞萌 fs-overlay 一致：只保留时间轴 + 时间 + 走带按钮。 */
    body.fullscreen #controls {
      position: absolute;
      z-index: 8;
      inset: auto 0 0;
      border: 0;
      border-radius: 0;
      background: rgba(11,13,18,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      transition: translate 220ms ease, opacity 220ms ease;
    }
    body.fullscreen #controls.hidden { translate: 0 100%; opacity: 0; pointer-events: none; }
    body.fullscreen .controls-settings { display: none; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  </style>
</head>
<body>
  <div id="app">
    <header id="header">
      <span id="title">谱面确认</span>
      <span id="status"></span>
    </header>
    <div id="stage-wrap">
      <section class="stage" id="stage" aria-label="谱面确认舞台">
        <canvas id="chart-canvas" aria-hidden="true"></canvas>
        <div class="game-hud" aria-hidden="true">
          <div class="game-progress"><i id="game-progress-fill"></i></div>
          <div class="score-block"><strong id="score-display">0000000</strong></div>
          <div class="combo-block" id="combo-block"><strong id="combo-display">0</strong><span>COMBO</span></div>
        </div>
      </section>
    </div>
    <section id="controls" aria-label="播放控制">
      <div class="row">
        <div id="timeline-host">
          <div id="timeline-bars"></div>
          <div id="timeline-ruler"></div>
          <div id="timeline-playhead"></div>
          <div id="timeline-badge"></div>
        </div>
      </div>
      <div class="row" style="justify-content:center">
        <span id="time-label">0:00 / 0:00</span>
      </div>
      <div class="row transport-group">
        <div class="transport-side left">
          <button class="transport-btn" id="btn-restart" type="button" aria-label="重播" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h12"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H5"/></svg>
          </button>
          <button class="transport-btn" id="btn-step-back" type="button" aria-label="步退" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
        </div>
        <button id="play-button" type="button" aria-label="播放" disabled>
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="transport-side right">
          <button class="transport-btn" id="btn-step-forward" type="button" aria-label="步进" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="transport-btn" id="btn-fullscreen" type="button" aria-label="进入全屏" title="全屏" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3"/><path d="M21 8V5a2 2 0 00-2-2h-3"/><path d="M3 16v3a2 2 0 002 2h3"/><path d="M16 21h3a2 2 0 002-2v-3"/></svg>
          </button>
        </div>
      </div>
      <div class="row wrap controls-settings">
        <div class="field wheel-field"><span>播放速度</span>
          <button class="wheel-trigger" id="speed-trigger" type="button"><span id="speed-val">1.00×</span></button>
          <div class="wheel-popup" id="speed-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="播放速度拨轮">
              <div class="wheel-viewport" id="speed-wheel"><div class="wheel-list" id="speed-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field"><span>音符大小</span>
          <button class="wheel-trigger" id="note-size-trigger" type="button"><span id="note-size-val">1.00×</span></button>
          <div class="wheel-popup" id="note-size-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="音符大小拨轮">
              <div class="wheel-viewport" id="note-size-wheel"><div class="wheel-list" id="note-size-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field"><span>音乐音量</span>
          <button class="wheel-trigger" id="volume-trigger" type="button"><span id="volume-val">100%</span></button>
          <div class="wheel-popup" id="volume-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="音乐音量拨轮">
              <div class="wheel-viewport" id="volume-wheel"><div class="wheel-list" id="volume-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field"><span>背景暗度</span>
          <button class="wheel-trigger" id="dim-trigger" type="button"><span id="dim-val">55%</span></button>
          <div class="wheel-popup" id="dim-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="背景暗度拨轮">
              <div class="wheel-viewport" id="dim-wheel"><div class="wheel-list" id="dim-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field"><span>打击音量</span>
          <button class="wheel-trigger" id="hit-sound-volume-trigger" type="button"><span id="hit-sound-volume-val">100%</span></button>
          <div class="wheel-popup" id="hit-sound-volume-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="打击音量拨轮">
              <div class="wheel-viewport" id="hit-sound-volume-wheel"><div class="wheel-list" id="hit-sound-volume-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field"><span>判定线颜色</span>
          <button class="wheel-trigger text" id="line-color-trigger" type="button"><span id="line-color-val">白色</span></button>
          <div class="wheel-popup" id="line-color-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="判定线颜色拨轮">
              <div class="wheel-viewport" id="line-color-wheel"><div class="wheel-list" id="line-color-list"></div></div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row wrap controls-settings">
        <button class="toggle" id="multi-hint" type="button" aria-pressed="true">多押辅助</button>
      </div>
    </section>
  </div>
  <script src="./music-data.js"></script>
  <!--PHIGROS_CHART_PREVIEW_CONFIG-->
  <script src="./player.js"></script>
</body>
</html>
