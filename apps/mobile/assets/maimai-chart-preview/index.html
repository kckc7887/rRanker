<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>谱面确认</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #161a22;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #5b8cff;
      --border: #2a3140;
      --wheel-item-h: 28px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      gap: 8px;
    }
    #header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-height: 24px;
      flex-shrink: 0;
    }
    #title {
      font-size: 15px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    #canvas-wrap {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    #canvas-stage {
      position: relative;
      width: 0;
      height: 0;
      flex-shrink: 0;
    }
    #chart-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #controls {
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row.wrap { flex-wrap: wrap; }
    button, label, input[type="range"] {
      font: inherit;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      padding: 8px 16px;
      min-width: 72px;
    }
    #play {
      width: 40px;
      height: 40px;
      min-width: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #play svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    #seek { flex: 1; }
    #seek {
      -webkit-appearance: none;
      appearance: none;
      height: 2px;
      background: var(--border);
      border-radius: 1px;
      outline: none;
    }
    #seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 8px;
      height: 18px;
      border-radius: 3px;
      background: #fff;
      border: 0;
      box-shadow: 0 0 6px rgba(255,255,255,0.6);
      cursor: pointer;
    }
    #seek::-moz-range-thumb {
      width: 8px;
      height: 18px;
      border-radius: 3px;
      background: #fff;
      border: 0;
      box-shadow: 0 0 6px rgba(255,255,255,0.6);
      cursor: pointer;
    }
    #timeline-host {
      flex: 1;
      position: relative;
      height: 36px;
      cursor: pointer;
      user-select: none;
      touch-action: none;
    }
    #timeline-bars {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 14px;
      height: 22px;
      overflow: hidden;
    }
    .timeline-bar {
      position: absolute;
      bottom: 0;
      min-width: 1px;
      display: flex;
      flex-direction: column-reverse;
    }
    #timeline-ruler {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 4px;
      height: 10px;
    }
    .timeline-tick {
      position: absolute;
      bottom: 0;
      width: 1px;
      background: var(--border);
    }
    .timeline-tick.major { height: 8px; background: var(--accent); }
    .timeline-tick.medium { height: 5px; }
    .timeline-tick.minor { height: 3px; }
    .timeline-label {
      position: absolute;
      bottom: 0;
      font-size: 8px;
      color: var(--muted);
      font-family: monospace;
      transform: translateX(-50%);
    }
    #timeline-playhead {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      border-radius: 2px;
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.7);
      pointer-events: none;
      transform: translateX(-1px);
      z-index: 10;
    }
    #timeline-badge {
      position: absolute;
      top: -16px;
      transform: translateX(-50%);
      background: #fff;
      color: #0b0d12;
      font-size: 10px;
      font-family: monospace;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
    }
    #info-bar {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .info-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 0 10px;
      height: 14px;
      overflow: hidden;
    }
    .info-item { white-space: nowrap; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .info-item.static { flex-shrink: 0; }
    .info-val { color: var(--text); font-variant-numeric: tabular-nums; }
    .info-fps-green { color: #22c55e; }
    .info-fps-yellow { color: #eab308; }
    .info-fps-red { color: #ef4444; }
    #time-label {
      font-size: 12px;
      color: var(--muted);
      min-width: 88px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .field input[type="range"] { width: 88px; }
    .wheel-field {
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .wheel-trigger {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 26px;
      padding: 0 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      font-family: inherit;
    }
    .wheel-trigger.text {
      width: 54px;
      min-width: 54px;
      flex-shrink: 0;
      font-variant-numeric: normal;
    }
    .wheel-trigger:active { opacity: 0.7; }
    .wheel-popup {
      position: fixed;
      z-index: 1000;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    }
    .wheel-popup .wheel {
      border-radius: 12px;
    }
    .wheel {
      position: relative;
      width: 72px;
      height: calc(var(--wheel-item-h) * 3);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f131a;
      overflow: hidden;
      touch-action: pan-y;
    }
    .wheel-viewport {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .wheel-viewport::-webkit-scrollbar { display: none; }
    .wheel-list {
      padding: var(--wheel-item-h) 0;
    }
    .wheel-item {
      height: var(--wheel-item-h);
      line-height: var(--wheel-item-h);
      text-align: center;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      scroll-snap-align: center;
    }
    .wheel-item[aria-selected="true"] {
      color: var(--text);
      font-weight: 700;
    }
    .wheel-highlight {
      pointer-events: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: var(--wheel-item-h);
      transform: translateY(-50%);
      border-top: 1px solid rgba(91, 140, 255, 0.45);
      border-bottom: 1px solid rgba(91, 140, 255, 0.45);
      background: rgba(91, 140, 255, 0.12);
    }
    .toggle {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .toggle[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .section-divider {
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="title">谱面确认</div>
      <div id="status">准备中…</div>
    </div>
    <div id="info-bar">
      <div class="info-row">
        <span class="info-item">BPM: <span class="info-val" id="info-bpm">--</span></span>
        <span class="info-item"><span class="info-val" id="info-beat">0:0.00</span></span>
        <span class="info-item"><span class="info-val" id="info-fps">--</span></span>
      </div>
      <div class="info-row">
        <span class="info-item">COMBO: <span class="info-val" id="info-combo">0 / 0</span></span>
        <span class="info-item" id="info-break-wrap" style="display:none">BREAK: <span class="info-val" id="info-break">0 / 0</span></span>
        <span class="info-item" id="info-break-noex-wrap" style="display:none">（无保护套 <span class="info-val" id="info-break-noex">0 / 0</span>）</span>
      </div>
    </div>
    <div id="canvas-wrap">
      <div id="canvas-stage">
        <canvas id="chart-canvas"></canvas>
      </div>
    </div>
    <div id="controls">
      <div class="row">
        <button id="play" type="button" aria-label="播放">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div id="timeline-host">
          <div id="timeline-bars"></div>
          <div id="timeline-ruler"></div>
          <div id="timeline-playhead"></div>
          <div id="timeline-badge"></div>
        </div>
        <div id="time-label">0:00 / 0:00</div>
      </div>
      <div class="row wrap">
        <div class="field wheel-field" id="hi-speed-field">
          流速
          <button class="wheel-trigger" id="hi-speed-trigger" type="button">
            <span id="hi-speed-val">6.0</span>
          </button>
          <div class="wheel-popup" id="hi-speed-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="流速滚轮">
              <div class="wheel-viewport" id="hi-speed-wheel">
                <div class="wheel-list" id="hi-speed-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="speed-field">
          倍速
          <button class="wheel-trigger" id="speed-trigger" type="button">
            <span id="speed-val">1.0</span>
          </button>
          <div class="wheel-popup" id="speed-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="倍速滚轮">
              <div class="wheel-viewport" id="speed-wheel">
                <div class="wheel-list" id="speed-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="music-vol-field">
          音乐
          <button class="wheel-trigger" id="music-vol-trigger" type="button">
            <span id="music-vol-val">10.0</span>
          </button>
          <div class="wheel-popup" id="music-vol-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="音乐音量">
              <div class="wheel-viewport" id="music-vol-wheel">
                <div class="wheel-list" id="music-vol-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="sound-vol-field">
          打击音
          <button class="wheel-trigger" id="sound-vol-trigger" type="button">
            <span id="sound-vol-val">10.0</span>
          </button>
          <div class="wheel-popup" id="sound-vol-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="打击音音量">
              <div class="wheel-viewport" id="sound-vol-wheel">
                <div class="wheel-list" id="sound-vol-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row wrap section-divider">
        <div class="field wheel-field" id="mirror-field">
          镜像
          <button class="wheel-trigger text" id="mirror-trigger" type="button">
            <span id="mirror-val">无</span>
          </button>
          <div class="wheel-popup" id="mirror-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="镜像选项">
              <div class="wheel-viewport" id="mirror-wheel">
                <div class="wheel-list" id="mirror-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="style-field">
          款式
          <button class="wheel-trigger text" id="style-trigger" type="button">
            <span id="style-val">判定区</span>
          </button>
          <div class="wheel-popup" id="style-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="款式选项">
              <div class="wheel-viewport" id="style-wheel">
                <div class="wheel-list" id="style-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="row wrap">
        <button class="toggle" id="toggle-pink" type="button">粉色星星头</button>
        <button class="toggle" id="toggle-star-rot" type="button">星星头旋转</button>
        <button class="toggle" id="toggle-ex" type="button">高亮保护套</button>
        <button class="toggle" id="toggle-break-slide" type="button">标准色绝赞</button>
        <button class="toggle" id="toggle-hit" type="button">打击特效</button>
        <button class="toggle" id="toggle-firework" type="button">烟花特效</button>
      </div>
    </div>
  </div>
  <!--CHART_PREVIEW_CONFIG-->
  <script src="./player.js"></script>
</body>
</html>
