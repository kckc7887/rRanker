<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>谱面确认</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --panel: #161a22;
      --text: #f3f5f8;
      --muted: #9aa3b2;
      --accent: #5b8cff;
      --border: #2a3140;
      --wheel-item-h: 28px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      gap: 8px;
    }
    #header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      min-height: 24px;
      flex-shrink: 0;
    }
    #title {
      font-size: 15px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #status {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    #canvas-wrap {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    #canvas-stage {
      position: relative;
      width: 0;
      height: 0;
      flex-shrink: 0;
    }
    #chart-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #controls {
      flex-shrink: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .row.wrap { flex-wrap: wrap; }
    button, label, input[type="range"] {
      font: inherit;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      padding: 8px 16px;
      min-width: 72px;
    }
    #play {
      width: 40px;
      height: 40px;
      min-width: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #play svg {
      width: 20px;
      height: 20px;
      display: block;
    }
    #seek { flex: 1; }
    #seek {
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
    }
    #seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      cursor: pointer;
    }
    #seek::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid #fff;
      cursor: pointer;
    }
    #info-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 0 10px;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
      height: 16px;
      overflow: hidden;
    }
    .info-item { white-space: nowrap; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .info-item.static { flex-shrink: 0; }
    .info-val { color: var(--text); font-variant-numeric: tabular-nums; }
    .info-fps-green { color: #22c55e; }
    .info-fps-yellow { color: #eab308; }
    .info-fps-red { color: #ef4444; }
    #time-label {
      font-size: 12px;
      color: var(--muted);
      min-width: 88px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .field input[type="range"] { width: 88px; }
    .field input[type="checkbox"] { width: 16px; height: 16px; }
    .wheel-field {
      align-items: center;
      gap: 8px;
      position: relative;
    }
    .wheel-trigger {
      appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 28px;
      padding: 0 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      font-family: inherit;
    }
    .wheel-trigger:active { opacity: 0.7; }
    .wheel-popup {
      position: fixed;
      z-index: 1000;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.5));
    }
    .wheel-popup .wheel {
      border-radius: 12px;
    }
    .wheel {
      position: relative;
      width: 72px;
      height: calc(var(--wheel-item-h) * 3);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0f131a;
      overflow: hidden;
      touch-action: pan-y;
    }
    .wheel-viewport {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .wheel-viewport::-webkit-scrollbar { display: none; }
    .wheel-list {
      padding: var(--wheel-item-h) 0;
    }
    .wheel-item {
      height: var(--wheel-item-h);
      line-height: var(--wheel-item-h);
      text-align: center;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      scroll-snap-align: center;
    }
    .wheel-item[aria-selected="true"] {
      color: var(--text);
      font-weight: 700;
    }
    .wheel-highlight {
      pointer-events: none;
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: var(--wheel-item-h);
      transform: translateY(-50%);
      border-top: 1px solid rgba(91, 140, 255, 0.45);
      border-bottom: 1px solid rgba(91, 140, 255, 0.45);
      background: rgba(91, 140, 255, 0.12);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div id="title">谱面确认</div>
      <div id="status">准备中…</div>
    </div>
    <div id="info-bar">
      <span class="info-item">BPM: <span class="info-val" id="info-bpm">--</span></span>
      <span class="info-item"><span class="info-val" id="info-beat">0:0.00</span></span>
      <span class="info-item"><span class="info-val" id="info-combo">0 / 0</span></span>
      <span class="info-item" id="info-break-wrap" style="display:none">BREAK: <span class="info-val" id="info-break">0 / 0</span></span>
      <span class="info-item" id="info-break-noex-wrap" style="display:none">无保护 <span class="info-val" id="info-break-noex">0 / 0</span></span>
      <span class="info-item"><span class="info-val" id="info-fps">--</span></span>
    </div>
    <div id="canvas-wrap">
      <div id="canvas-stage">
        <canvas id="chart-canvas"></canvas>
      </div>
    </div>
    <div id="controls">
      <div class="row">
        <button id="play" type="button" aria-label="播放">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <input id="seek" type="range" min="0" max="1" step="0.001" value="0" />
        <div id="time-label">0:00 / 0:00</div>
      </div>
      <div class="row wrap">
        <div class="field wheel-field" id="hi-speed-field">
          流速
          <button class="wheel-trigger" id="hi-speed-trigger" type="button">
            <span id="hi-speed-val">6.0</span>
          </button>
          <div class="wheel-popup" id="hi-speed-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="流速滚轮">
              <div class="wheel-viewport" id="hi-speed-wheel">
                <div class="wheel-list" id="hi-speed-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <div class="field wheel-field" id="speed-field">
          倍速
          <button class="wheel-trigger" id="speed-trigger" type="button">
            <span id="speed-val">1.0</span>
          </button>
          <div class="wheel-popup" id="speed-popup" style="visibility:hidden;pointer-events:none">
            <div class="wheel" aria-label="倍速滚轮">
              <div class="wheel-viewport" id="speed-wheel">
                <div class="wheel-list" id="speed-list"></div>
              </div>
              <div class="wheel-highlight"></div>
            </div>
          </div>
        </div>
        <label class="field"><input id="music-enabled" type="checkbox" checked /> 音乐</label>
        <label class="field"><input id="sound-enabled" type="checkbox" checked /> 打击音</label>
        <label class="field">音乐 <input id="music-volume" type="range" min="0" max="1" step="0.05" value="0.8" /></label>
        <label class="field">打击音 <input id="sound-volume" type="range" min="0" max="1" step="0.05" value="0.6" /></label>
      </div>
    </div>
  </div>
  <!--CHART_PREVIEW_CONFIG-->
  <script src="./player.js"></script>
</body>
</html>
